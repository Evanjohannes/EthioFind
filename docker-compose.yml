services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ethiofind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethiofind
      POSTGRES_PASSWORD: ethiofind_dev_password
      POSTGRES_DB: ethiofind_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:20
    container_name: ethiofind-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://ethiofind:ethiofind_dev_password@postgres:5432/ethiofind_db?schema=public
      PORT: 4000
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      - postgres

volumes:
  postgres_data: